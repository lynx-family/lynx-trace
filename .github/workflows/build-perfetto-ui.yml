name: Build Perfetto UI

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name'
        required: true
        default: 'v0.0.1'
        type: string
      upload_artifacts:
        description: 'Upload UI build artifacts'
        required: true
        default: true
        type: boolean

jobs:
  build-ui:
    name: Build Perfetto UI
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Patch install script
      run: |
        sed -i "s/'--frozen-lockfile'//g" tools/install-build-deps

    - name: Install UI build dependencies
      run: |
        tools/install-build-deps --ui

    - name: Build UI
      run: |
        ui/build --out out/dist

    - name: Set build metadata
      if: ${{ inputs.upload_artifacts }}
      id: build-info
      run: echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

    - name: Package UI artifacts
      if: ${{ inputs.upload_artifacts }}
      run: |
        cd out/dist/ui/dist
        tar -czf perfetto-ui-${{ github.sha }}.tar.gz ./*

    - name: Create Release
      if: ${{ inputs.upload_artifacts }}
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        tag_name: ${{ github.event.inputs.tag_name }}
        target_commitish: ${{ github.sha }}
        name: Perfetto UI ${{ github.event.inputs.tag_name }}
        body: |
          Perfetto UI build
          - Build date: ${{ steps.build-info.outputs.build_date }}
          - Commit: ${{ github.sha }}
        draft: false
        prerelease: false
        files: |
          out/dist/ui/dist/perfetto-ui-${{ github.sha }}.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
