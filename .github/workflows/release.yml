name: Publish Trace Analysis Skill

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - alpha

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: ./trace_analysis
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Upgrade npm CLI to latest
        run: npm install -g npm@latest

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build packages
        run: pnpm build

      - name: Create changeset
        run: |
          cat > .changeset/release-packages.md <<'EOF'
          ---
          "@lynx-js/skill-lynx-trace-analysis": patch
          ---

          Release trace analysis skill
          EOF

      - name: Version and publish patch version
        if: ${{ github.event.inputs.release_type == 'patch' }}
        run: |
          pnpm changeset:version
          git add -A
          git commit -m "chore: release trace analysis packages"

      - name: Push changes
        if: ${{ github.event.inputs.release_type == 'patch' }}
        uses: ad-m/github-push-action@7fba72704ad2db819788db8f2d9e7d1dfbebe089 # master
        with:
          branch: ${{ github.ref }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: |
          if [ "${{ github.event.inputs.release_type }}" = "patch" ]; then
            pnpm changeset:publish
          else
            pnpm changeset:alpha
          fi
